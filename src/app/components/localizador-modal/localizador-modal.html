<div class="modal-header">
  <span class="modal-title">Localizador de Servidoras e Servidores</span>
  <button mat-icon-button (click)="fecharModal()" class="btn-close" aria-label="Fechar">
    <mat-icon>close</mat-icon>
  </button>
</div>

<!-- Container de Pílulas de Unidade -->
<div class="pilulas-container" *ngIf="temMultiplasUnidades()">

  <button
    type="button"
    class="pilula-btn"
    [class.ativa]="unidadeSelecionada() === 'TODAS'"
    (click)="selecionarUnidade('TODAS')">
    Todas ({{ servidores.length }})
  </button>

  <button
    type="button"
    *ngFor="let item of unidadesComContagem()"
    class="pilula-btn"
    [class.ativa]="unidadeSelecionada() === item.sigla"
    (click)="selecionarUnidade(item.sigla)">
    {{ item.sigla }} ({{ item.quantidade }})
  </button>

</div>

<div class="modal-top-spacer" *ngIf="!temMultiplasUnidades()"></div>

<mat-dialog-content class="modal-body">
  <!-- Caso sem resultados -->
  <div id="LocServ_result_template_noresults" *ngIf="servidores.length === 0">
    Desculpe, não localizamos ninguém com os dados informados.
  </div>

  <!-- Lista de resultados -->
  <div id="LocServ_result_template_results" *ngIf="servidores.length > 0">
    <div class="servidor-card" *ngFor="let item of servidoresFiltrados()">

      <!-- Avatar SVG Genérico -->
      <div class="avatar-container">
        <svg class="avatar-img" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="20" fill="#CCCCCC"/>
          <circle cx="20" cy="15" r="7" fill="#888888"/>
          <path d="M7 33C7 26 12 24 20 24C28 24 33 26 33 33" fill="#888888"/>
        </svg>
      </div>

      <!-- Nome e Unidade -->
      <div class="info-container">
        <div class="nome-wrapper">
          <span class="servidor-nome">{{ item.nome }}</span>
          <button
            mat-icon-button
            class="btn-copy"
            matTooltip="Copiar nome"
            (click)="copiarTexto(item.nome, 'Nome')">
            <mat-icon class="copy-icon">content_copy</mat-icon>
          </button>
        </div>
        <div class="servidor-unidade">{{ item.nomeUnidade }}</div>
      </div>

      <!-- E-mail e Ramal -->
      <div class="contact-container">
        <div class="email-wrapper" *ngIf="item.email">
          <span class="servidor-email">{{ item.email }}</span>
          <button
            mat-icon-button
            class="btn-copy"
            matTooltip="Copiar e-mail"
            (click)="copiarTexto(item.email, 'E-mail')">
            <mat-icon class="copy-icon">content_copy</mat-icon>
          </button>
        </div>
        <span class="servidor-ramal" *ngIf="item.ramal">{{ item.ramal }}</span>
      </div>

    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-footer">
  <button mat-stroked-button class="btn-ok" (click)="fecharModal()">Ok</button>
</mat-dialog-actions>
