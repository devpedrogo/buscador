<div id="LocServ_container">
  <div class="coluna_titulo">Localizador</div>

  <form (ngSubmit)="onSubmit()">
    <!-- Campo Nome -->
    <div class="LocServ_field_container">
      <label for="nome">Nome</label>
      <input
        type="text"
        id="nome"
        name="nome"
        [ngModel]="nomeBusca()"
        (ngModelChange)="onInputNomeChange($event)"
        [matAutocomplete]="autoNome"
        placeholder="Digite o nome do servidor"
        autocomplete="off"
        panelWidth="100%"
      />

      <mat-autocomplete
        #autoNome="matAutocomplete"
        (optionSelected)="onNomeSelecionado($event)"
        class="custom-autocomplete-panel">

        <mat-option *ngIf="isCarregandoNomes()" disabled>
          Buscando servidores...
        </mat-option>

        <mat-option
          *ngFor="let nome of sugestoesNome()"
          [value]="nome">
          {{ nome }}
        </mat-option>

        <!-- Sem resultados -->
        <mat-option *ngIf="!isCarregandoNomes() && sugestoesNome().length === 0 && nomeBusca().trim().length >= 1" disabled>
          Nenhum servidor encontrado
        </mat-option>
      </mat-autocomplete>
    </div>

    <!-- Campo Unidade com Autocomplete e Filtro -->
    <div class="LocServ_field_container">
      <label for="unidade">Unidade de lotação</label>
      <input
        type="text"
        id="unidade"
        name="unidade"
        [ngModel]="unidadeTextoInput()"
        (ngModelChange)="onInputUnidadeChange($event)"
        [matAutocomplete]="autoUnidade"

        (click)="onFocusUnidades()"
        (blur)="onBlurUnidades()"
        placeholder="Digite o nome da unidade"
        autocomplete="off"
      />

      <mat-autocomplete
        #autoUnidade="matAutocomplete"
        (optionSelected)="onUnidadeSelecionada($event)"
        panelWidth="380px"
        class="custom-autocomplete-panel">

        <!-- Opção Geral "Todo o Tribunal" -->
        <mat-option value="Todo o Tribunal">
          Todo o Tribunal
        </mat-option>

        <!-- Lista Filtrada Dinamicamente -->
        <mat-option
          *ngFor="let unidade of unidadesFiltradas()"
          [value]="`${unidade.siglaUnidade} - ${unidade.descricaoUnidade}`">
          {{ `${unidade.siglaUnidade} - ${unidade.descricaoUnidade}` }}
        </mat-option>
      </mat-autocomplete>
    </div>

    <!-- Botão Localizar -->
    <div id="LocServ_field_container_botao" class="LocServ_field_container">
      <button
        type="submit"
        class="btn-localizar"
        [disabled]="isLoading()">
        {{ isLoading() ? 'Buscando...' : 'Localizar 🔎' }}
      </button>
    </div>
  </form>

  <div class="LocServ_texto">
    <span>Dica:</span> Para localizar todas as pessoas de uma unidade, não preencha o campo "Nome".
  </div>
</div>
